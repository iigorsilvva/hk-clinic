<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HK Clinic — Recepção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.top{background:#fff;border-bottom:.5px solid #e8e5e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.top-brand{display:flex;align-items:center;gap:12px;}
.top-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.top-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#1a1a1a;}
.top-sub{font-size:10px;color:#b8b4ae;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:14px;}
.badge-conn{font-size:11px;padding:5px 12px;border-radius:20px;background:#f5f3f0;color:#888;border:.5px solid #e0ddd8;}
.badge-conn.verde{background:#e8f5e8;color:#2a7a2a;border-color:#b0d8b0;}
.badge-conn.vermelho{background:#fae8e8;color:#8a2a2a;border-color:#d8b0b0;}
.top-som{font-size:12px;color:#888;cursor:pointer;padding:5px 10px;border-radius:20px;border:.5px solid #e0ddd8;background:#fff;}
.top-som:hover{background:#f5f3f0;}
.alerta{display:none;background:#fff3cd;border:.5px solid #ffc107;color:#856404;padding:12px 20px;font-size:13px;text-align:center;}
.alerta a{color:#856404;font-weight:500;}
.main{max-width:960px;margin:0 auto;padding:20px;}
.tabs{display:flex;margin-bottom:18px;background:#fff;border-radius:12px;border:.5px solid #e8e5e0;overflow:hidden;}
.tab{flex:1;padding:13px;text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#b8b4ae;border:none;background:transparent;font-family:inherit;transition:background .15s;}
.tab.on{background:#3a3937;color:#fff;}
.tsec{display:none;}.tsec.on{display:block;}
.sec-h{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b8b4ae;margin-bottom:12px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:14px;border:.5px solid #e8e5e0;overflow:hidden;animation:cIn .3s ease;}
@keyframes cIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card.servido{opacity:.45;}
.card-top{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.card-l{flex:1;}
.chip{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.c-ped{background:#f0ede8;color:#8a7a5a;}
.c-con{background:#eae8f0;color:#5a4a8a;}
.c-age{background:#e8f0ea;color:#3a7a5a;}
.c-psi{background:#f0e8ee;color:#8a4a7a;}
.resumo{font-size:14px;color:#1a1a1a;line-height:1.7;}
.card-meta{font-size:11px;color:#b8b4ae;margin-top:5px;}
.tag-servido{font-size:10px;color:#4caf50;font-weight:500;margin-top:4px;}
.card-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.hora{font-size:22px;font-weight:300;color:#1a1a1a;}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s;}
.b-ok{background:#3a3937;color:#fff;}.b-ok:hover{background:#2a2927;}
.b-det{background:#f0e8d8;color:#8a6830;border:.5px solid #e0c898;}.b-det:hover{background:#e8dcc8;}
.b-srv{background:#f5f3f0;color:#b8b4ae;border:.5px solid #dddad5;cursor:default;}
.det{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.det.open{max-height:600px;}
.det-inner{margin:0 20px 16px;background:#f7f5f2;border-radius:10px;padding:14px 16px;}
.det-row{display:flex;gap:8px;padding:6px 0;border-bottom:.5px solid #edeae5;align-items:flex-start;}
.det-row:last-child{border-bottom:none;}
.det-k{color:#888;width:110px;flex-shrink:0;font-size:12px;padding-top:1px;}
.det-v{color:#1a1a1a;font-weight:500;font-size:13px;word-break:break-all;}
.empty{text-align:center;padding:52px 20px;}
.empty-t{font-size:13px;color:#c8c4be;}
.notif{display:none;position:fixed;top:0;left:0;right:0;background:#3a3937;color:#fff;text-align:center;font-size:13px;padding:14px;z-index:999;animation:sld .3s ease;}
@keyframes sld{from{transform:translateY(-100%)}to{transform:translateY(0)}}
</style>
</head>

<script>
var DB = 'https://hk-clinic-default-rtdb.firebaseio.com';
var DUAS_H = 2 * 60 * 60 * 1000;
var vistos = {};

// ---- SOM ----
var actx = null;
function soar(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [784,988,1175].forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*.18;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.2,t+.04);
      g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.55);
    });
  }catch(e){}
}

// ---- ABAS ----
function aba(nome){
  ['pedidos','agenda'].forEach(function(n){
    document.getElementById('tbtn-'+n).className='tab'+(n===nome?' on':'');
    document.getElementById('tsec-'+n).className='tsec'+(n===nome?' on':'');
  });
}

// ---- HELPERS ----
function det_row(k,v){
  return '<div class="det-row"><span class="det-k">'+k+'</span><span class="det-v">'+(v||'—')+'</span></div>';
}
function rm_empty(lid){var e=document.querySelector('#'+lid+' .empty');if(e)e.remove();}
function upd_lbl(tipo){
  var isPed=(tipo==='pedido'||tipo==='concierge');
  var lid=isPed?'list-pedidos':'list-agenda';
  var lbl=isPed?'lbl-pedidos':'lbl-agenda';
  var n=document.querySelectorAll('#'+lid+' .card').length;
  var txt;
  if(isPed) txt=n===0?'Aguardando pedidos...':n+(n===1?' pedido':' pedidos');
  else       txt=n===0?'Nenhum agendamento ainda':n+(n===1?' registro':' registros');
  document.getElementById(lbl).textContent=txt;
}
function notif(msg){
  var nb=document.getElementById('notif');
  nb.textContent=msg; nb.style.display='block';
  clearTimeout(nb._t);
  nb._t=setTimeout(function(){nb.style.display='none';},4500);
}
function badge(txt,cor){
  var el=document.getElementById('badge');
  el.textContent=txt; el.className='badge-conn '+cor;
}

// ---- TOGGLE DETALHES ----
function toggleDet(id){
  var el=document.getElementById('det-'+id);
  var bt=document.getElementById('db-'+id);
  if(!el) return;
  var open=el.classList.toggle('open');
  if(bt) bt.textContent=open?'Fechar ▴':'Ver detalhes ▾';
}

// ---- MARCAR SERVIDO ----
function marcarServido(id){
  var btn=document.getElementById('ob-'+id);
  if(btn){btn.textContent='Salvando...';btn.disabled=true;}
  fetch(DB+'/pedidos/'+id+'.json',{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({status:'servido'})
  })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var card=document.getElementById('card-'+id);
    if(card) card.classList.add('servido');
    if(btn){btn.className='btn b-srv';btn.textContent='✓ Servido';btn.onclick=null;}
    var cl=card?card.querySelector('.card-l'):null;
    if(cl&&!cl.querySelector('.tag-servido')){
      var tg=document.createElement('div');
      tg.className='tag-servido';tg.textContent='✓ Servido';
      var mt=cl.querySelector('.card-meta');
      if(mt) cl.insertBefore(tg,mt); else cl.appendChild(tg);
    }
  })
  .catch(function(e){
    alert('Erro ao salvar: '+e.message);
    if(btn){btn.textContent='Concluir';btn.disabled=false;}
  });
}

// ---- RENDERIZAR CARD ----
function renderCard(id, d){
  if(vistos[id]) return;
  vistos[id]=true;

  var tipo=(d.tipo||'pedido');
  var status=(d.status||'novo');
  var isServido=(status==='servido'||status==='concluido');
  var tsMs=d.ts_client||null;
  var isPed=(tipo==='pedido'||tipo==='concierge');

  // Ignorar pedidos de menu expirados
  if(isPed && tsMs && (Date.now()-tsMs)>DUAS_H) return;

  // Chip
  var chips={
    pedido:    {c:'c-ped',l:'☕ Pedido'},
    concierge: {c:'c-con',l:'🛎️ Concierge'},
    agendamento:{c:'c-age',l:'📅 Agendamento'},
    psicologia: {c:'c-psi',l:'🧠 Psicologia'}
  };
  var chip=chips[tipo]||chips.pedido;

  // Resumo
  var resumo='';
  if(tipo==='pedido'){
    resumo=(d.itens||[]).map(function(i){return '• '+i;}).join('<br>');
  } else if(tipo==='concierge'){
    resumo='Concierge solicitado na sala de repouso';
  } else if(tipo==='agendamento'){
    resumo='<strong>'+(d.nome||'—')+'</strong><br>'+(d.servico||'Serviço não informado');
  } else if(tipo==='psicologia'){
    resumo='<strong>'+(d.nome||'—')+'</strong><br>Interesse em Psicologia Integrada';
  }

  // Detalhes
  var detHtml='', temDet=false;
  if(tipo==='agendamento'){
    temDet=true;
    detHtml=det_row('Paciente',d.nome)+det_row('Serviço',d.servico)+det_row('Data',d.data)+det_row('Horário',d.horario)+det_row('Enviado às',d.hora);
  } else if(tipo==='psicologia'){
    temDet=true;
    detHtml=det_row('Nome',d.nome)+det_row('WhatsApp',d.whatsapp)+det_row('Interesse','Psicologia Integrada · Isabela Hasse')+det_row('Enviado às',d.hora);
  }

  // Botão
  var btnHtml='';
  if(isPed){
    if(isServido){
      btnHtml='<button class="btn b-srv" disabled>✓ Servido</button>';
    } else {
      btnHtml='<button class="btn b-ok" id="ob-'+id+'" onclick="marcarServido(''+id+'')">Concluir</button>';
    }
  } else if(temDet){
    btnHtml='<button class="btn b-det" id="db-'+id+'" onclick="toggleDet(''+id+'')">Ver detalhes ▾</button>';
  }

  var servicoTag=isServido?'<div class="tag-servido">✓ Servido</div>':'';

  var card=document.createElement('div');
  card.id='card-'+id;
  card.className='card'+(isServido?' servido':'');
  card.innerHTML=
    '<div class="card-top">'+
      '<div class="card-l">'+
        '<span class="chip '+chip.c+'">'+chip.l+'</span>'+
        '<div class="resumo">'+resumo+'</div>'+
        servicoTag+
        '<div class="card-meta">Sala de Repouso · '+(d.hora||'')+'</div>'+
      '</div>'+
      '<div class="card-r">'+
        '<div class="hora">'+(d.hora||'--:--')+'</div>'+
        btnHtml+
      '</div>'+
    '</div>'+
    (temDet?'<div class="det" id="det-'+id+'"><div class="det-inner">'+detHtml+'</div></div>':'');

  var lid=isPed?'list-pedidos':'list-agenda';
  rm_empty(lid);
  document.getElementById(lid).prepend(card);
  upd_lbl(tipo);

  // Auto-remover pedidos após 2h
  if(isPed){
    var rem=tsMs?Math.max(0,DUAS_H-(Date.now()-tsMs)):DUAS_H;
    setTimeout(function(){
      var c2=document.getElementById('card-'+id);
      if(c2) c2.remove();
      if(!document.querySelector('#list-pedidos .card')){
        document.getElementById('list-pedidos').innerHTML='<div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div>';
      }
      upd_lbl('pedido');
    },rem);
  }

  // Notificação apenas se não servido ainda
  if(!isServido){
    soar();
    var msgs={pedido:'🛎️ Novo pedido!',concierge:'🛎️ Concierge!',agendamento:'📅 Novo agendamento!',psicologia:'🧠 Interesse em Psicologia!'};
    notif(msgs[tipo]||'Novo pedido!');
  }
}

// ---- CONEXÃO FIREBASE VIA SSE (EventSource) ----
var evtSrc = null;
var erros = 0;

function conectar(){
  badge('Conectando...','');
  if(evtSrc) evtSrc.close();

  evtSrc = new EventSource(DB+'/pedidos.json');

  evtSrc.addEventListener('put', function(e){
    erros=0;
    badge('Conectado ✓','verde');
    document.getElementById('alerta').style.display='none';
    try{
      var obj=JSON.parse(e.data);
      if(obj.data && typeof obj.data==='object'){
        Object.keys(obj.data).forEach(function(id){
          renderCard(id, obj.data[id]);
        });
      }
    }catch(err){console.error('put parse error',err);}
  });

  evtSrc.addEventListener('patch', function(e){
    erros=0;
    badge('Conectado ✓','verde');
    try{
      var obj=JSON.parse(e.data);
      // obj.path pode ser "/" (novo pedido) ou "/id" (atualização)
      var data=obj.data;
      if(!data) return;
      var path=obj.path||'/';

      if(path==='/'){
        // Novo(s) pedido(s)
        Object.keys(data).forEach(function(id){
          if(data[id] && typeof data[id]==='object'){
            renderCard(id, data[id]);
          }
        });
      } else {
        // Atualização de pedido existente (ex: status=servido)
        var id=path.replace(/^\/+/,'');
        var card=document.getElementById('card-'+id);
        if(card && data.status==='servido'){
          card.classList.add('servido');
          var ob=document.getElementById('ob-'+id);
          if(ob){ob.className='btn b-srv';ob.textContent='✓ Servido';ob.onclick=null;}
        }
      }
    }catch(err){console.error('patch parse error',err);}
  });

  evtSrc.onerror = function(){
    erros++;
    badge('Sem conexão','vermelho');
    if(erros===1){
      document.getElementById('alerta').style.display='block';
    }
    // Reconectar após 5s
    setTimeout(function(){
      if(evtSrc.readyState===2) conectar();
    },5000);
  };
}

conectar();
</script>
</body>
</html>
