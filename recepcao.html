<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HK Clinic — Recepção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.top{background:#fff;border-bottom:.5px solid #e8e5e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.top-brand{display:flex;align-items:center;gap:12px;}
.top-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.top-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#1a1a1a;}
.top-sub{font-size:10px;color:#b8b4ae;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:16px;}
.conn{font-size:11px;padding:4px 10px;border-radius:20px;background:#f5f3f0;color:#888;}
.conn.ok{background:#e8f5e8;color:#2a7a2a;}
.conn.err{background:#fae8e8;color:#8a2a2a;}
.top-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;cursor:pointer;}
.dot-live{width:7px;height:7px;border-radius:50%;background:#ccc;}
.dot-live.on{background:#4caf50;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.main{max-width:960px;margin:0 auto;padding:24px 20px;}
.tabs{display:flex;margin-bottom:20px;background:#fff;border-radius:12px;border:.5px solid #e8e5e0;overflow:hidden;}
.tab{flex:1;padding:13px;text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#b8b4ae;border:none;background:transparent;font-family:inherit;}
.tab.on{background:#3a3937;color:#fff;}
.tab-sec{display:none;}.tab-sec.on{display:block;}
.sec-h{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b8b4ae;margin-bottom:14px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:14px;border:.5px solid #e8e5e0;overflow:hidden;animation:cIn .3s ease;}
@keyframes cIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card.servido .card-itens{color:#aaa;}
.card-top{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.card-l{flex:1;}
.chip{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.chip-pedido{background:#f0ede8;color:#8a7a5a;}
.chip-agenda{background:#e8f0ea;color:#3a7a5a;}
.chip-conc{background:#eae8f0;color:#5a4a8a;}
.chip-psic{background:#f0e8ee;color:#8a4a7a;}
.chip-conc-chamado{background:#eae8f0;color:#5a4a8a;}
.card-itens{font-size:14px;color:#1a1a1a;line-height:1.7;margin-bottom:4px;}
.card-meta{font-size:11px;color:#b8b4ae;margin-top:4px;}
.servido-tag{font-size:10px;color:#4caf50;font-weight:500;margin-top:4px;}
.card-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.card-hora{font-size:22px;font-weight:300;color:#1a1a1a;}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-ok{background:#3a3937;color:#fff;}.btn-ok:hover{background:#2a2927;}
.btn-det{background:#f0e8d8;color:#8a6830;border:.5px solid #e0d0a8;}.btn-det:hover{background:#e8dcc8;}
.btn-done{background:#f5f3f0;color:#b8b4ae;border:.5px solid #dddad5;cursor:default;}
.det{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.det.open{max-height:500px;}
.det-inner{margin:0 20px 16px;background:#f7f5f2;border-radius:10px;padding:14px 16px;}
.det-row{display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:.5px solid #edeae5;}
.det-row:last-child{border-bottom:none;}
.det-k{color:#888;width:110px;flex-shrink:0;font-size:12px;}
.det-v{color:#1a1a1a;font-weight:500;word-break:break-all;}
.empty{text-align:center;padding:48px 20px;}
.empty-t{font-size:13px;color:#c8c4be;}
.notif{display:none;position:fixed;top:0;left:0;right:0;background:#3a3937;color:#fff;text-align:center;font-size:13px;padding:14px;z-index:999;animation:sld .3s ease;}
@keyframes sld{from{transform:translateY(-100%)}to{transform:translateY(0)}}
</style>
</head>
<body>

  </div>
  <div class="top-right">
    <span class="conn" id="conn-status">Conectando...</span>
    <div class="top-status" onclick="soar()" title="Clique para ativar som">
      <div class="dot-live" id="dot"></div>Ao vivo 🔔
    </div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab on" id="tab-btn-pedidos" onclick="trocaAba('pedidos')">☕ Pedidos do Menu</button>
    <button class="tab"    id="tab-btn-agenda"  onclick="trocaAba('agenda')">📅 Agendamentos</button>
  </div>
  <div class="tab-sec on" id="tab-pedidos">
    <div class="sec-h" id="lbl-pedidos">Aguardando pedidos...</div>
    <div class="cards" id="list-pedidos"><div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div></div>
  </div>
  <div class="tab-sec" id="tab-agenda">
    <div class="sec-h" id="lbl-agenda">Agendamentos e solicitações</div>
    <div class="cards" id="list-agenda"><div class="empty"><div class="empty-t">Nenhum agendamento ainda</div></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var CFG = {
  apiKey:"AIzaSyDdPzVk3DVpJ3L_4M8HG2kjEZLaTHJCdmo",
  authDomain:"hk-clinic.firebaseapp.com",
  databaseURL:"https://hk-clinic-default-rtdb.firebaseio.com",
  projectId:"hk-clinic",
  storageBucket:"hk-clinic.firebasestorage.app",
  messagingSenderId:"208880180495",
  appId:"1:208880180495:web:518ac316bd08422daab27a"
};

firebase.initializeApp(CFG);
var db = firebase.database();

// Status
var connRef = db.ref('.info/connected');
connRef.on('value', function(snap){
  var ok = snap.val() === true;
  var el = document.getElementById('conn-status');
  var dot = document.getElementById('dot');
  el.textContent = ok ? 'Conectado' : 'Sem conexão';
  el.className = 'conn ' + (ok?'ok':'err');
  if(dot) dot.className = 'dot-live ' + (ok?'on':'');
});

// ---- SOM ----
var actx = null;
function soar(){
  try{
    if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [784,988,1175].forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.18;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.2,t+.04);
      g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g);g.connect(actx.destination);
      o.start(t);o.stop(t+.55);
    });
  }catch(e){}
}
document.addEventListener('click', function(){ soar(); }, {once:true});

// ---- ABAS ----
function trocaAba(nome){
  ['pedidos','agenda'].forEach(function(n){
    document.getElementById('tab-btn-'+n).className='tab'+(n===nome?' on':'');
    document.getElementById('tab-'+n).className='tab-sec'+(n===nome?' on':'');
  });
}

// ---- CONSTANTES ----
var DUAS_HORAS = 2*60*60*1000;
var seen = {};

// ---- HELPERS ----
function linhaDetalhe(k,v){
  return '<div class="det-row"><span class="det-k">'+k+'</span><span class="det-v">'+(v||'—')+'</span></div>';
}
function removeVazio(listId){
  var e=document.querySelector('#'+listId+' .empty');
  if(e) e.remove();
}
function atualizaContador(tipo){
  var isPedido=(tipo==='pedido'||tipo==='concierge');
  var listId=isPedido?'list-pedidos':'list-agenda';
  var lblId=isPedido?'lbl-pedidos':'lbl-agenda';
  var n=document.querySelectorAll('#'+listId+' .card').length;
  if(isPedido){
    document.getElementById(lblId).textContent=n===0?'Aguardando pedidos...':n+(n===1?' pedido':' pedidos');
  } else {
    document.getElementById(lblId).textContent=n===0?'Nenhum agendamento ainda':n+(n===1?' registro':' registros');
  }
}
function notificar(msg){
  var nb=document.getElementById('notif');
  nb.textContent=msg; nb.style.display='block';
  setTimeout(function(){nb.style.display='none';},4000);
}

// ---- EXPANDIR DETALHES ----
function toggleDet(id){
  var det=document.getElementById('det-'+id);
  var btn=document.getElementById('detbtn-'+id);
  if(!det) return;
  var aberto=det.classList.toggle('open');
  if(btn) btn.textContent=aberto?'Fechar ▴':'Ver detalhes ▾';
}

// ---- MARCAR SERVIDO ----
function marcarServido(id){
  db.ref('pedidos/'+id).update({status:'servido'}, function(err){
    if(err){ alert('Erro ao salvar. Verifique a conexão.'); return; }
    var card=document.getElementById('card-'+id);
    if(card) card.classList.add('servido');
    var btn=document.getElementById('okbtn-'+id);
    if(btn){ btn.className='btn btn-done'; btn.textContent='✓ Servido'; btn.disabled=true; btn.onclick=null; }
    var cardL=card?card.querySelector('.card-l'):null;
    if(cardL && !cardL.querySelector('.servido-tag')){
      var tag=document.createElement('div');
      tag.className='servido-tag'; tag.textContent='✓ Servido';
      var meta=cardL.querySelector('.card-meta');
      if(meta) cardL.insertBefore(tag,meta);
    }
  });
}

// ---- ESCUTA FIREBASE ----
db.ref('pedidos').on('child_added', function(snap){
  var id  = snap.key;
  var d   = snap.val();
  if(!d || seen[id]) return;
  seen[id] = true;

  var tipo      = d.tipo || 'pedido';
  var status    = d.status || 'novo';
  var isServido = (status==='servido'||status==='concluido');
  var tsMs      = d.ts_client || null;
  var isPedido  = (tipo==='pedido'||tipo==='concierge');

  // Ignorar pedidos de menu expirados (>2h)
  if(isPedido && tsMs && (Date.now()-tsMs) > DUAS_HORAS) return;

  // ---- CHIP ----
  var chipMap = {
    pedido:    {cls:'chip-pedido', lbl:'☕ Pedido'},
    concierge: {cls:'chip-conc',   lbl:'🛎️ Concierge'},
    agendamento:{cls:'chip-agenda', lbl:'📅 Agendamento'},
    psicologia: {cls:'chip-psic',   lbl:'🧠 Psicologia'}
  };
  var chip = chipMap[tipo] || chipMap.pedido;

  // ---- RESUMO ----
  var resumo = '';
  if(tipo==='pedido'){
    resumo = (d.itens||[]).map(function(i){return '• '+i;}).join('<br>');
  } else if(tipo==='concierge'){
    resumo = 'Concierge solicitado';
  } else if(tipo==='agendamento'){
    resumo = '<strong>'+(d.nome||'—')+'</strong><br>'+(d.servico||'Serviço não informado');
  } else if(tipo==='psicologia'){
    resumo = '<strong>'+(d.nome||'—')+'</strong><br>Interesse em Psicologia Integrada';
  }

  // ---- DETALHES ----
  var detHtml = '';
  var temDet  = false;
  if(tipo==='agendamento'){
    temDet=true;
    detHtml=
      linhaDetalhe('Paciente', d.nome)+
      linhaDetalhe('Serviço',  d.servico)+
      linhaDetalhe('Data',     d.data)+
      linhaDetalhe('Horário',  d.horario)+
      linhaDetalhe('Enviado',  d.hora);
  } else if(tipo==='psicologia'){
    temDet=true;
    detHtml=
      linhaDetalhe('Nome',      d.nome)+
      linhaDetalhe('WhatsApp',  d.whatsapp)+
      linhaDetalhe('Enviado',   d.hora)+
      linhaDetalhe('Interesse', 'Psicologia Integrada · Isabela Hasse');
  }

  // ---- BOTÃO ----
  var btnHtml = '';
  if(isPedido){
    if(isServido){
      btnHtml='<button class="btn btn-done" disabled>✓ Servido</button>';
    } else {
      btnHtml='<button class="btn btn-ok" id="okbtn-'+id+'" onclick="marcarServido(''+id+'')">Concluir</button>';
    }
  } else if(temDet){
    btnHtml='<button class="btn btn-det" id="detbtn-'+id+'" onclick="toggleDet(''+id+'')">Ver detalhes ▾</button>';
  }

  var servicoTag = isServido ? '<div class="servido-tag">✓ Servido</div>' : '';

  var html =
    '<div class="card-top">'+
      '<div class="card-l">'+
        '<span class="chip '+chip.cls+'">'+chip.lbl+'</span>'+
        '<div class="card-itens">'+resumo+'</div>'+
        servicoTag+
        '<div class="card-meta">Sala de Repouso · '+(d.hora||'')+'</div>'+
      '</div>'+
      '<div class="card-r">'+
        '<div class="card-hora">'+(d.hora||'--:--')+'</div>'+
        btnHtml+
      '</div>'+
    '</div>'+
    (temDet?'<div class="det" id="det-'+id+'"><div class="det-inner">'+detHtml+'</div></div>':'');

  var card = document.createElement('div');
  card.id = 'card-'+id;
  card.className = 'card' + (isServido?' servido':'');
  card.innerHTML = html;

  var listId = isPedido ? 'list-pedidos' : 'list-agenda';
  removeVazio(listId);
  document.getElementById(listId).prepend(card);
  atualizaContador(tipo);

  // Auto-remover pedidos de menu após 2h
  if(isPedido){
    var restante = tsMs ? Math.max(0, DUAS_HORAS-(Date.now()-tsMs)) : DUAS_HORAS;
    setTimeout(function(){
      var c2=document.getElementById('card-'+id);
      if(c2) c2.remove();
      if(!document.querySelector('#list-pedidos .card')){
        document.getElementById('list-pedidos').innerHTML='<div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div>';
      }
      atualizaContador('pedido');
    }, restante);
  }

  // Som e notificação apenas para novos
  if(!isServido){
    soar();
    var msgs={pedido:'🛎️ Novo pedido!',concierge:'🛎️ Concierge!',agendamento:'📅 Novo agendamento!',psicologia:'🧠 Psicologia!'};
    notificar(msgs[tipo]||'Novo pedido!');
  }
});

// Erros
db.ref('pedidos').on('cancelled', function(err){
  console.error('Firebase cancelado:', err);
  document.getElementById('conn-status').textContent='Erro: '+err.message;
  document.getElementById('conn-status').className='conn err';
});
</script>
</body>
</html>
