<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HK Clinic — Recepção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.top{background:#fff;border-bottom:.5px solid #e8e5e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.top-brand{display:flex;align-items:center;gap:12px;}
.top-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.top-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#1a1a1a;}
.top-sub{font-size:10px;color:#b8b4ae;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:12px;}
.badge{font-size:11px;padding:5px 12px;border-radius:20px;background:#f5f3f0;color:#888;border:.5px solid #e0ddd8;}
.badge.verde{background:#e8f5e8;color:#2a7a2a;border-color:#b0d8b0;}
.badge.vermelho{background:#fae8e8;color:#8a2a2a;border-color:#d8b0b0;}
.btn-som{font-size:12px;padding:5px 12px;border-radius:20px;border:.5px solid #e0ddd8;background:#fff;cursor:pointer;color:#888;}
.main{max-width:960px;margin:0 auto;padding:20px;}
.tabs{display:flex;margin-bottom:16px;background:#fff;border-radius:12px;border:.5px solid #e8e5e0;overflow:hidden;}
.tab{flex:1;padding:13px;text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#b8b4ae;border:none;background:transparent;font-family:inherit;}
.tab.on{background:#3a3937;color:#fff;}
.tsec{display:none;}.tsec.on{display:block;}
.sec-h{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b8b4ae;margin-bottom:12px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:14px;border:.5px solid #e8e5e0;overflow:hidden;animation:ci .35s ease;}
@keyframes ci{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card.servido{opacity:.4;}
.ctop{padding:16px 20px;display:flex;gap:16px;align-items:flex-start;}
.cl{flex:1;}
.chip{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.ch-ped{background:#f0ede8;color:#8a7a5a;}
.ch-con{background:#eae8f0;color:#5a4a8a;}
.ch-age{background:#e8f0ea;color:#3a7a5a;}
.ch-psi{background:#f0e8ee;color:#8a4a7a;}
.resumo{font-size:14px;color:#1a1a1a;line-height:1.7;}
.card-meta{font-size:11px;color:#b8b4ae;margin-top:5px;}
.tag-srv{font-size:10px;color:#4caf50;font-weight:500;margin-top:4px;}
.cr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.hora{font-size:22px;font-weight:300;color:#1a1a1a;}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;}
.b-ok{background:#3a3937;color:#fff;}.b-ok:hover{background:#2a2927;}
.b-det{background:#f0e8d8;color:#8a6830;border:.5px solid #e0c898;}.b-det:hover{background:#e8dcc8;}
.b-srv{background:#f5f3f0;color:#b8b4ae;border:.5px solid #dddad5;cursor:default;}
.det{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.det.open{max-height:600px;}
.det-inner{margin:0 20px 16px;background:#f7f5f2;border-radius:10px;padding:14px 16px;}
.drow{display:flex;gap:8px;padding:6px 0;border-bottom:.5px solid #edeae5;}
.drow:last-child{border-bottom:none;}
.dk{color:#888;width:110px;flex-shrink:0;font-size:12px;}
.dv{color:#1a1a1a;font-weight:500;font-size:13px;word-break:break-all;}
.empty{text-align:center;padding:52px 20px;}
.empty-t{font-size:13px;color:#c8c4be;}
.notif{display:none;position:fixed;top:0;left:0;right:0;background:#3a3937;color:#fff;text-align:center;font-size:14px;padding:16px;z-index:999;animation:sld .3s ease;}
@keyframes sld{from{transform:translateY(-100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="notif" id="notif"></div>
<div class="top">
  <div class="top-brand">

    <div><div class="top-name">HK Clinic</div><div class="top-sub">Painel da Recepção</div></div>
  </div>
  <div class="top-right">
    <span class="badge" id="badge">Conectando...</span>
    <button class="btn-som" onclick="soar()">🔔 Som</button>
  </div>
</div>
<div class="main">
  <div class="tabs">
    <button class="tab on" id="tb-ped" onclick="aba('ped')">☕ Pedidos do Menu</button>
    <button class="tab"    id="tb-age" onclick="aba('age')">📅 Agendamentos</button>
  </div>
  <div class="tsec on" id="ts-ped">
    <div class="sec-h" id="lbl-ped">Aguardando pedidos...</div>
    <div class="cards" id="lp"><div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div></div>
  </div>
  <div class="tsec" id="ts-age">
    <div class="sec-h" id="lbl-age">Agendamentos e solicitações</div>
    <div class="cards" id="la"><div class="empty"><div class="empty-t">Nenhum agendamento ainda</div></div></div>
  </div>
</div>

<script>
var DB     = 'https://hk-clinic-default-rtdb.firebaseio.com';
var DUAS_H = 2 * 60 * 60 * 1000;
var vistos = {};
var actx   = null;

function soar(){
  try{
    if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [784,988,1175].forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.18;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.55);
    });
  }catch(e){}
}

function aba(n){
  ['ped','age'].forEach(function(x){
    document.getElementById('tb-'+x).className='tab'+(x===n?' on':'');
    document.getElementById('ts-'+x).className='tsec'+(x===n?' on':'');
  });
}

function notif(msg){
  var nb=document.getElementById('notif');
  nb.textContent=msg;nb.style.display='block';
  clearTimeout(nb._t);nb._t=setTimeout(function(){nb.style.display='none';},4500);
}

function setBadge(txt,cor){
  var el=document.getElementById('badge');
  el.textContent=txt;el.className='badge '+cor;
}

function dr(k,v){
  return '<div class="drow"><span class="dk">'+k+'</span><span class="dv">'+(v||'—')+'</span></div>';
}

function rmEmpty(id){var e=document.querySelector('#'+id+' .empty');if(e)e.remove();}

function updLbl(isPed){
  var lid=isPed?'lp':'la', lbl=isPed?'lbl-ped':'lbl-age';
  var n=document.querySelectorAll('#'+lid+' .card').length;
  document.getElementById(lbl).textContent=isPed
    ?(n===0?'Aguardando pedidos...':n+(n===1?' pedido':' pedidos'))
    :(n===0?'Nenhum agendamento ainda':n+(n===1?' registro':' registros'));
}

// Usar data-id em vez de onclick inline com aspas
document.addEventListener('click', function(e){
  // Botão concluir
  var btnOk = e.target.closest('[data-concluir]');
  if(btnOk){ marcarServido(btnOk.getAttribute('data-concluir'), btnOk); return; }

  // Botão ver detalhes
  var btnDet = e.target.closest('[data-detalhe]');
  if(btnDet){ toggleDet(btnDet.getAttribute('data-detalhe'), btnDet); return; }
});

function toggleDet(id, btn){
  var el=document.getElementById('d-'+id);
  if(!el) return;
  var open=el.classList.toggle('open');
  if(btn) btn.textContent=open?'Fechar ▴':'Ver detalhes ▾';
}

function marcarServido(id, btn){
  if(btn){ btn.textContent='Salvando...'; btn.disabled=true; }
  fetch(DB+'/pedidos/'+id+'.json',{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:'{"status":"servido"}'
  })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var card=document.getElementById('c-'+id);
    if(card) card.classList.add('servido');
    if(btn){ btn.className='btn b-srv'; btn.textContent='✓ Servido'; btn.removeAttribute('data-concluir'); btn.disabled=false; }
    var cl=card?card.querySelector('.cl'):null;
    if(cl&&!cl.querySelector('.tag-srv')){
      var t=document.createElement('div');
      t.className='tag-srv';t.textContent='✓ Servido';
      var mt=cl.querySelector('.card-meta');
      if(mt) cl.insertBefore(t,mt); else cl.appendChild(t);
    }
  })
  .catch(function(e){
    alert('Erro ao salvar: '+e.message);
    if(btn){ btn.textContent='Concluir'; btn.disabled=false; }
  });
}

function renderCard(id, d){
  if(vistos[id]) return;
  vistos[id]=true;

  var tipo  = d.tipo||'pedido';
  var isSrv = (d.status==='servido'||d.status==='concluido');
  var tsMs  = d.ts_client||null;
  var isPed = (tipo==='pedido'||tipo==='concierge');

  if(isPed && tsMs && (Date.now()-tsMs)>DUAS_H) return;

  var chips={
    pedido:    {c:'ch-ped',l:'☕ Pedido'},
    concierge: {c:'ch-con',l:'🛎️ Concierge'},
    agendamento:{c:'ch-age',l:'📅 Agendamento'},
    psicologia: {c:'ch-psi',l:'🧠 Psicologia'}
  };
  var chip=chips[tipo]||chips.pedido;

  var resumo='';
  if(tipo==='pedido'){
    resumo=(d.itens||[]).map(function(i){return '• '+i;}).join('<br>');
  } else if(tipo==='concierge'){
    resumo='Concierge solicitado na sala de repouso';
  } else if(tipo==='agendamento'){
    resumo='<strong>'+(d.nome||'—')+'</strong><br>'+(d.servico||'Serviço não informado');
  } else if(tipo==='psicologia'){
    resumo='<strong>'+(d.nome||'—')+'</strong><br>Interesse em Psicologia Integrada';
  }

  var detHtml='', temDet=false;
  if(tipo==='agendamento'){
    temDet=true;
    detHtml=dr('Paciente',d.nome)+dr('Serviço',d.servico)+dr('Data',d.data)+dr('Horário',d.horario)+dr('Enviado às',d.hora);
  } else if(tipo==='psicologia'){
    temDet=true;
    detHtml=dr('Nome',d.nome)+dr('WhatsApp',d.whatsapp)+dr('Interesse','Psicologia Integrada · Isabela Hasse')+dr('Enviado às',d.hora);
  }

  var btnHtml='';
  if(isPed){
    btnHtml=isSrv
      ?'<button class="btn b-srv" disabled>✓ Servido</button>'
      :'<button class="btn b-ok" data-concluir="'+id+'">Concluir</button>';
  } else if(temDet){
    btnHtml='<button class="btn b-det" data-detalhe="'+id+'">Ver detalhes ▾</button>';
  }

  var card=document.createElement('div');
  card.id='c-'+id;
  card.className='card'+(isSrv?' servido':'');
  card.innerHTML=
    '<div class="ctop">'+
      '<div class="cl">'+
        '<span class="chip '+chip.c+'">'+chip.l+'</span>'+
        '<div class="resumo">'+resumo+'</div>'+
        (isSrv?'<div class="tag-srv">✓ Servido</div>':'')+
        '<div class="card-meta">Sala de Repouso · '+(d.hora||'')+'</div>'+
      '</div>'+
      '<div class="cr">'+
        '<div class="hora">'+(d.hora||'--:--')+'</div>'+
        btnHtml+
      '</div>'+
    '</div>'+
    (temDet?'<div class="det" id="d-'+id+'"><div class="det-inner">'+detHtml+'</div></div>':'');

  var lid=isPed?'lp':'la';
  rmEmpty(lid);
  document.getElementById(lid).prepend(card);
  updLbl(isPed);

  if(isPed){
    var rem=tsMs?Math.max(0,DUAS_H-(Date.now()-tsMs)):DUAS_H;
    setTimeout(function(){
      var c2=document.getElementById('c-'+id);
      if(c2) c2.remove();
      if(!document.querySelector('#lp .card')){
        document.getElementById('lp').innerHTML='<div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div>';
      }
      updLbl(true);
    },rem);
  }

  if(!isSrv){
    soar();
    var msgs={pedido:'🛎️ Novo pedido!',concierge:'🛎️ Concierge!',agendamento:'📅 Novo agendamento!',psicologia:'🧠 Interesse em Psicologia!'};
    notif(msgs[tipo]||'Novo pedido!');
  }
}

var erros=0;
function buscar(){
  fetch(DB+'/pedidos.json')
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(dados){
    erros=0;
    setBadge('Conectado ✓','verde');
    if(dados && typeof dados==='object'){
      Object.keys(dados).forEach(function(id){
        if(dados[id]) renderCard(id, dados[id]);
      });
    }
  })
  .catch(function(e){
    erros++;
    setBadge('Sem conexão ✗','vermelho');
    console.error('Erro Firebase:', e.message);
  });
}

buscar();
setInterval(buscar, 3000);
</script>
</body>
</html>
