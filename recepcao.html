<title>HK Clinic — Recepção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.top{background:#fff;border-bottom:.5px solid #e8e5e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.top-brand{display:flex;align-items:center;gap:12px;}
.top-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.top-info{}
.top-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#1a1a1a;}
.top-sub{font-size:10px;color:#b8b4ae;margin-top:2px;letter-spacing:.06em;}
.top-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;}
.dot-live{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.main{max-width:900px;margin:0 auto;padding:24px 20px;}
.sec-h{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#b8b4ae;margin-bottom:14px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:14px;border:.5px solid #e8e5e0;padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;animation:cIn .3s ease;}
@keyframes cIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.card.done{opacity:.45;}
.card-left{flex:1;}
.card-tipo{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:4px 10px;border-radius:20px;margin-bottom:12px;}
.tipo-pedido{background:#f0ede8;color:#8a7a5a;}
.tipo-agenda{background:#e8eeea;color:#4a7a5a;}
.card-itens{font-size:14px;color:#1a1a1a;line-height:1.8;}
.card-meta{font-size:11px;color:#b8b4ae;margin-top:8px;}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
.card-hora{font-size:22px;font-weight:300;color:#1a1a1a;letter-spacing:.04em;}
.card-btn{padding:9px 18px;background:#3a3937;color:#fff;border:none;border-radius:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.card-btn:hover{background:#2a2927;}
.card-btn.done-btn{background:#f5f3f0;color:#b8b4ae;border:.5px solid #e0ddd8;cursor:default;}
.empty{text-align:center;padding:64px 20px;color:#c8c4be;}
.empty-ico{font-size:32px;margin-bottom:16px;opacity:.4;}
.empty-t{font-size:14px;letter-spacing:.08em;color:#b8b4ae;}
.badge-new{width:8px;height:8px;border-radius:50%;background:#e8a070;flex-shrink:0;margin-top:5px;}
.notif-bar{display:none;position:fixed;top:0;left:0;right:0;background:#3a3937;color:#fff;text-align:center;font-size:13px;padding:14px;z-index:999;animation:slideDown .3s ease;}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onChildAdded, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ⚙️ MESMO CONFIG DO KIOSK
const firebaseConfig = {
  apiKey: "AIzaSyDdPzVk3DVpJ3L_4M8HG2kjEZLaTHJCdmo",
  authDomain: "hk-clinic.firebaseapp.com",
  databaseURL: "https://hk-clinic-default-rtdb.firebaseio.com",
  projectId: "hk-clinic",
  storageBucket: "hk-clinic.firebasestorage.app",
  messagingSenderId: "208880180495",
  appId: "1:208880180495:web:518ac316bd08422daab27a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let total = 0;
const seen = new Set();

onChildAdded(ref(db, 'pedidos'), (snapshot) => {
  const id = snapshot.key;
  if(seen.has(id)) return;
  seen.add(id);
  const d = snapshot.val();
  total++;

  document.getElementById('sec-label').textContent = total + (total===1?' pedido recebido':' pedidos recebidos');

  // remove empty state
  const empty = document.querySelector('.empty');
  if(empty) empty.remove();

  const isTipo = d.tipo === 'pedido';
  let itensHtml = '';
  if(isTipo){
    itensHtml = (d.itens||[]).map(i=>'• '+i).join('<br>');
  } else {
    itensHtml = '<strong>'+d.servico+'</strong><br>'+d.nome+' · '+d.data+' às '+d.horario;
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+id;
  card.innerHTML =
    '<div class="card-left">' +
      '<div class="card-tipo '+(isTipo?'tipo-pedido':'tipo-agenda')+'">' +
        (isTipo ? '☕ Pedido' : '📅 Agendamento') +
      '</div>' +
      '<div class="card-itens">'+itensHtml+'</div>' +
      '<div class="card-meta">Sala de Repouso · '+d.hora+'</div>' +
    '</div>' +
    '<div class="card-right">' +
      '<div class="card-hora">'+(d.hora||'--:--')+'</div>' +
      '<button class="card-btn" id="btn-'+id+'" onclick="marcarFeito(\''+id+'\')">Concluir</button>' +
    '</div>';

  document.getElementById('cards-list').prepend(card);

  // notificação no topo
  if(total > 0){
    const nb = document.getElementById('notif-bar');
    nb.textContent = isTipo ? '🛎️ Novo pedido da sala de repouso!' : '📅 Novo agendamento solicitado!';
    nb.style.display = 'block';
    setTimeout(()=>{ nb.style.display='none'; }, 4000);
  }

  // som de notificação
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    o.stop(ctx.currentTime+0.4);
  }catch(e){}
});

window.marcarFeito = function(id) {
  update(ref(db, 'pedidos/'+id), {status:'concluido'});
  const card = document.getElementById('card-'+id);
  if(card){ card.classList.add('done'); }
  const btn = document.getElementById('btn-'+id);
  if(btn){ btn.textContent='Concluído'; btn.className='card-btn done-btn'; }
}
</script>
