<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HK Clinic — Recepção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f3f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
.top{background:#fff;border-bottom:.5px solid #e8e5e0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.top-brand{display:flex;align-items:center;gap:12px;}
.top-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.top-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#1a1a1a;}
.top-sub{font-size:10px;color:#b8b4ae;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:12px;}
.top-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;cursor:pointer;}
.dot-live{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.main{max-width:900px;margin:0 auto;padding:24px 20px;}
.sec-h{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#b8b4ae;margin-bottom:14px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:14px;border:.5px solid #e8e5e0;overflow:hidden;animation:cIn .3s ease;}
@keyframes cIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.card.done{opacity:.4;}
.card-main{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.card-left{flex:1;}
.card-tipo{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
.tipo-pedido{background:#f0ede8;color:#8a7a5a;}
.tipo-agenda{background:#e8eeea;color:#4a7a5a;}
.tipo-conc{background:#eae8f0;color:#5a4a8a;}
.tipo-psic{background:#f0e8ee;color:#8a4a7a;}
.card-itens{font-size:14px;color:#1a1a1a;line-height:1.8;}
.card-meta{font-size:11px;color:#b8b4ae;margin-top:8px;}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.card-hora{font-size:22px;font-weight:300;color:#1a1a1a;letter-spacing:.04em;}
.card-btn{padding:9px 16px;background:#3a3937;color:#fff;border:none;border-radius:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.card-btn:hover{background:#2a2927;}
.card-btn.done-btn{background:#f5f3f0;color:#b8b4ae;border:.5px solid #e0ddd8;cursor:default;}
.card-expand{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;}
.card-expand.open{max-height:300px;padding:0 20px 16px;}
.expand-inner{background:#f7f5f2;border-radius:10px;padding:14px 16px;}
.exp-row{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:.5px solid #edeae5;}
.exp-row:last-child{border-bottom:none;}
.exp-k{color:#888;min-width:90px;flex-shrink:0;}
.exp-v{color:#1a1a1a;font-weight:500;}
.expand-btn{font-size:11px;color:#b8a878;background:none;border:none;cursor:pointer;padding:4px 0;letter-spacing:.06em;text-decoration:underline;}
.empty{text-align:center;padding:64px 20px;color:#c8c4be;}
.empty-t{font-size:14px;color:#b8b4ae;}
.notif-bar{display:none;position:fixed;top:0;left:0;right:0;background:#3a3937;color:#fff;text-align:center;font-size:13px;padding:14px;z-index:999;animation:slideDown .3s ease;}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="notif-bar" id="notif-bar"></div>
<div class="top">
  <div class="top-brand">

    <div>
      <div class="top-name">HK Clinic</div>
      <div class="top-sub">Painel da Recepção</div>
    </div>
  </div>
  <div class="top-right">
    <div class="top-status" onclick="unlockAudio()" title="Clique para ativar som">
      <div class="dot-live"></div>Ao vivo 🔔
    </div>
  </div>
</div>

<div class="main">
  <div class="sec-h" id="sec-label">Aguardando pedidos...</div>
  <div class="cards" id="cards-list">
    <div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onChildAdded, update, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDdPzVk3DVpJ3L_4M8HG2kjEZLaTHJCdmo",
  authDomain: "hk-clinic.firebaseapp.com",
  databaseURL: "https://hk-clinic-default-rtdb.firebaseio.com",
  projectId: "hk-clinic",
  storageBucket: "hk-clinic.firebasestorage.app",
  messagingSenderId: "208880180495",
  appId: "1:208880180495:web:518ac316bd08422daab27a"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// --- AUDIO ---
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function playChime(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    [784,988,1175].forEach((freq,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime+i*0.18;
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.22,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:true});

// --- ESTADO PERSISTENTE ---
// concluded: Set de IDs marcados como concluídos (persiste no localStorage)
const DONE_KEY = 'hk_done_ids';
function getDoneSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(DONE_KEY)||'[]')); }
  catch(e){ return new Set(); }
}
function saveDone(set){
  try{ localStorage.setItem(DONE_KEY, JSON.stringify([...set])); }catch(e){}
}

// --- CONTROLE DE TEMPO ---
// Remove pedidos com mais de 2h automaticamente
const TWO_HOURS = 2 * 60 * 60 * 1000;
function isExpired(timestamp){
  if(!timestamp) return false;
  return (Date.now() - timestamp) > TWO_HOURS;
}

// --- RENDER ---
let total = 0;
const seen = new Set();
const doneSet = getDoneSet();

// Limpa IDs antigos do doneSet que não existem mais (limpeza periódica)
setInterval(()=>{
  const list = document.querySelectorAll('.card');
  const activeIds = new Set([...list].map(c=>c.id.replace('card-','')));
  let changed = false;
  [...doneSet].forEach(id=>{ if(!activeIds.has(id)){ doneSet.delete(id); changed=true; }});
  if(changed) saveDone(doneSet);
}, 60000);

onChildAdded(ref(db,'pedidos'), (snapshot)=>{
  const id  = snapshot.key;
  const d   = snapshot.val();
  if(seen.has(id)) return;
  seen.add(id);

  // Ignora pedidos com mais de 2h
  const tsMs = d.timestamp ? d.timestamp : null;
  if(tsMs && isExpired(tsMs)) return;

  total++;
  document.getElementById('sec-label').textContent =
    total + (total===1 ? ' pedido recebido' : ' pedidos recebidos');

  // Remove estado vazio
  const empty = document.querySelector('.empty');
  if(empty) empty.remove();

  const isDone = doneSet.has(id);
  const tipo   = d.tipo || 'pedido';

  // Label e cor
  let tipoClass='tipo-pedido', tipoLabel='☕ Pedido';
  if(tipo==='agendamento'){ tipoClass='tipo-agenda'; tipoLabel='📅 Agendamento'; }
  else if(tipo==='concierge'){ tipoClass='tipo-conc'; tipoLabel='🛎️ Concierge'; }
  else if(tipo==='psicologia'){ tipoClass='tipo-psic'; tipoLabel='🧠 Psicologia'; }

  // Conteúdo principal
  let itensHtml='';
  if(tipo==='pedido'){
    itensHtml = (d.itens||[]).map(i=>'• '+i).join('<br>');
  } else if(tipo==='agendamento'){
    itensHtml = '<strong>'+d.servico+'</strong><br>'+d.nome+' · '+d.data+' às '+d.horario;
  } else if(tipo==='concierge'){
    itensHtml = 'Solicita atendimento na sala de repouso';
  } else if(tipo==='psicologia'){
    itensHtml = '<strong>'+d.nome+'</strong> — interesse em Psicologia';
  }

  // Detalhes expansíveis (só para psicologia e agendamento)
  let expandHtml='';
  let hasExpand=false;
  if(tipo==='psicologia'){
    hasExpand=true;
    expandHtml=
      '<div class="exp-row"><span class="exp-k">Nome</span><span class="exp-v">'+(d.nome||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">WhatsApp</span><span class="exp-v">'+(d.whatsapp||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">Horário</span><span class="exp-v">'+(d.hora||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">Especialidade</span><span class="exp-v">Psicologia Integrada</span></div>';
  } else if(tipo==='agendamento'){
    hasExpand=true;
    expandHtml=
      '<div class="exp-row"><span class="exp-k">Paciente</span><span class="exp-v">'+(d.nome||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">Serviço</span><span class="exp-v">'+(d.servico||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">Data</span><span class="exp-v">'+(d.data||'—')+'</span></div>'+
      '<div class="exp-row"><span class="exp-k">Horário</span><span class="exp-v">'+(d.horario||'—')+'</span></div>';
  }

  const card = document.createElement('div');
  card.className = 'card' + (isDone?' done':'');
  card.id = 'card-'+id;
  card.innerHTML=
    '<div class="card-main">'+
      '<div class="card-left">'+
        '<div class="card-tipo '+tipoClass+'">'+tipoLabel+'</div>'+
        '<div class="card-itens">'+itensHtml+'</div>'+
        (hasExpand?'<button class="expand-btn" onclick="toggleExpand(''+id+'')">Ver detalhes ▾</button>':'')+
        '<div class="card-meta">Sala de Repouso · '+(d.hora||'')+'</div>'+
      '</div>'+
      '<div class="card-right">'+
        '<div class="card-hora">'+(d.hora||'--:--')+'</div>'+
        '<button class="'+(isDone?'card-btn done-btn':'card-btn')+'" id="btn-'+id+'" '+
          (isDone?'disabled':'onclick="marcarFeito(''+id+'')"')+'>'+
          (isDone?'Concluído':'Concluir')+
        '</button>'+
      '</div>'+
    '</div>'+
    (hasExpand?'<div class="card-expand" id="exp-'+id+'"><div class="expand-inner">'+expandHtml+'</div></div>':'');

  document.getElementById('cards-list').prepend(card);

  // Auto-remover após 2h
  if(tsMs){
    const remaining = TWO_HOURS - (Date.now()-tsMs);
    if(remaining > 0){
      setTimeout(()=>{ const c=document.getElementById('card-'+id); if(c) c.remove(); total--; updateLabel(); }, remaining);
    }
  } else {
    // Sem timestamp: remove após 2h a partir de agora
    setTimeout(()=>{ const c=document.getElementById('card-'+id); if(c) c.remove(); total--; updateLabel(); }, TWO_HOURS);
  }

  // Notificação e som (só se não for concluído)
  if(!isDone){
    playChime();
    const nb=document.getElementById('notif-bar');
    const msgs={'pedido':'🛎️ Novo pedido da sala de repouso!','agendamento':'📅 Novo agendamento solicitado!','concierge':'🛎️ Concierge solicitado na sala!','psicologia':'🧠 Novo interesse em Psicologia!'};
    nb.textContent = msgs[tipo]||'Novo pedido!';
    nb.style.display='block';
    setTimeout(()=>nb.style.display='none', 4000);
  }
});

function updateLabel(){
  const cards=document.querySelectorAll('.card');
  if(cards.length===0){
    document.getElementById('cards-list').innerHTML='<div class="empty"><div class="empty-t">Nenhum pedido no momento</div></div>';
    document.getElementById('sec-label').textContent='Aguardando pedidos...';
    total=0;
  } else {
    document.getElementById('sec-label').textContent=cards.length+(cards.length===1?' pedido recebido':' pedidos recebidos');
  }
}

window.toggleExpand=function(id){
  const exp=document.getElementById('exp-'+id);
  const btn=document.querySelector('#card-'+id+' .expand-btn');
  if(!exp) return;
  const isOpen=exp.classList.contains('open');
  exp.classList.toggle('open');
  if(btn) btn.textContent=isOpen?'Ver detalhes ▾':'Ocultar detalhes ▴';
};

window.marcarFeito=function(id){
  update(ref(db,'pedidos/'+id),{status:'concluido'});
  const card=document.getElementById('card-'+id);
  if(card) card.classList.add('done');
  const btn=document.getElementById('btn-'+id);
  if(btn){ btn.textContent='Concluído'; btn.className='card-btn done-btn'; btn.disabled=true; btn.removeAttribute('onclick'); }
  // Persiste no localStorage
  doneSet.add(id);
  saveDone(doneSet);
};
</script>
</body>
</html>
